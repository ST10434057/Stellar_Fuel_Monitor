name: Final POE bug report
description: Record a reproducible issue found during QA
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: area
    attributes:
      label: Area / screen / endpoint
      placeholder: e.g. Vehicle Details, Google SSO, PATCH /api/alerts/:id
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Tap...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device / Android version
      placeholder: e.g. Samsung A54 / Android 15

  - type: textarea
    id: evidence
    attributes:
      label: Logs / screenshot / API evidence
